<svg viewBox="0 0 820 500" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="820" height="500" fill="#F5F6FF"/>
  <text x="410" y="46" text-anchor="middle" font-size="29" font-weight="700" fill="#312E81">Containers vs Virtual Machines</text>
  <text x="410" y="72" text-anchor="middle" font-size="15" fill="#64748B">Key differences at a glance</text>

  <!-- header row -->
  <rect x="40" y="92" width="240" height="52" rx="8" fill="#312E81"/>
  <text x="160" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Feature</text>
  <rect x="288" y="92" width="248" height="52" rx="8" fill="#059669"/>
  <text x="412" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Docker Container</text>
  <rect x="544" y="92" width="236" height="52" rx="8" fill="#4F46E5"/>
  <text x="662" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Virtual Machine</text>

  <!-- rows -->
  <!-- row template values -->
  <g font-size="14.5">
    <!-- Isolation -->
    <rect x="40" y="152" width="240" height="58" rx="6" fill="#E0E7FF"/>
    <text x="60" y="187" font-weight="700" fill="#312E81">Isolation</text>
    <rect x="288" y="152" width="248" height="58" rx="6" fill="#ECFDF5"/>
    <text x="412" y="187" text-anchor="middle" fill="#065F46">Process-level</text>
    <rect x="544" y="152" width="236" height="58" rx="6" fill="#EEF2FF"/>
    <text x="662" y="187" text-anchor="middle" fill="#3730A3">Full OS-level</text>

    <!-- Performance -->
    <rect x="40" y="218" width="240" height="58" rx="6" fill="#E0E7FF"/>
    <text x="60" y="253" font-weight="700" fill="#312E81">Performance</text>
    <rect x="288" y="218" width="248" height="58" rx="6" fill="#ECFDF5"/>
    <text x="412" y="253" text-anchor="middle" fill="#065F46">Lightweight, fast</text>
    <rect x="544" y="218" width="236" height="58" rx="6" fill="#EEF2FF"/>
    <text x="662" y="253" text-anchor="middle" fill="#3730A3">Heavy, slower</text>

    <!-- Resource -->
    <rect x="40" y="284" width="240" height="58" rx="6" fill="#E0E7FF"/>
    <text x="60" y="319" font-weight="700" fill="#312E81">Resource use</text>
    <rect x="288" y="284" width="248" height="58" rx="6" fill="#ECFDF5"/>
    <text x="412" y="319" text-anchor="middle" fill="#065F46">Efficient</text>
    <rect x="544" y="284" width="236" height="58" rx="6" fill="#EEF2FF"/>
    <text x="662" y="319" text-anchor="middle" fill="#3730A3">Resource-intensive</text>

    <!-- Startup -->
    <rect x="40" y="350" width="240" height="58" rx="6" fill="#E0E7FF"/>
    <text x="60" y="385" font-weight="700" fill="#312E81">Startup time</text>
    <rect x="288" y="350" width="248" height="58" rx="6" fill="#ECFDF5"/>
    <text x="412" y="385" text-anchor="middle" fill="#065F46">Seconds</text>
    <rect x="544" y="350" width="236" height="58" rx="6" fill="#EEF2FF"/>
    <text x="662" y="385" text-anchor="middle" fill="#3730A3">Minutes</text>

    <!-- Portability -->
    <rect x="40" y="416" width="240" height="58" rx="6" fill="#E0E7FF"/>
    <text x="60" y="451" font-weight="700" fill="#312E81">Portability</text>
    <rect x="288" y="416" width="248" height="58" rx="6" fill="#ECFDF5"/>
    <text x="412" y="451" text-anchor="middle" fill="#065F46">Highly portable</text>
    <rect x="544" y="416" width="236" height="58" rx="6" fill="#EEF2FF"/>
    <text x="662" y="451" text-anchor="middle" fill="#3730A3">Less portable</text>
  </g>
</svg>
