<svg viewBox="0 0 820 520" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="820" height="520" fill="#F5F6FF"/>
  <text x="410" y="44" text-anchor="middle" font-size="29" font-weight="700" fill="#312E81">Virtual Machine Architecture</text>
  <text x="410" y="70" text-anchor="middle" font-size="15" fill="#64748B">How traditional virtualization is layered (bottom → top)</text>

  <!-- Applications -->
  <rect x="90" y="92" width="640" height="52" rx="10" fill="#EEF2FF" stroke="#818CF8" stroke-width="1.5"/>
  <text x="410" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#3730A3">Applications (inside each VM)</text>
  <text x="410" y="136" text-anchor="middle" font-size="11.5" fill="#64748B">Software &amp; services running inside every virtual machine</text>

  <!-- Guest OS x3 -->
  <g>
    <rect x="90" y="158" width="203" height="72" rx="10" fill="#C7D2FE" stroke="#6366F1"/>
    <text x="191" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#312E81">Guest OS (VM1)</text>
    <text x="191" y="210" text-anchor="middle" font-size="11.5" fill="#4338CA">Windows</text>
  </g>
  <g>
    <rect x="308" y="158" width="203" height="72" rx="10" fill="#C7D2FE" stroke="#6366F1"/>
    <text x="410" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#312E81">Guest OS (VM2)</text>
    <text x="410" y="210" text-anchor="middle" font-size="11.5" fill="#4338CA">Linux</text>
  </g>
  <g>
    <rect x="526" y="158" width="204" height="72" rx="10" fill="#C7D2FE" stroke="#6366F1"/>
    <text x="628" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#312E81">Guest OS (VM3)</text>
    <text x="628" y="210" text-anchor="middle" font-size="11.5" fill="#4338CA">macOS</text>
  </g>

  <!-- Hypervisor -->
  <rect x="90" y="244" width="640" height="62" rx="10" fill="#6366F1"/>
  <text x="410" y="272" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Hypervisor (VM Manager)</text>
  <text x="410" y="292" text-anchor="middle" font-size="11.5" fill="#E0E7FF">Creates &amp; manages VMs, allocates resources, isolates workloads</text>

  <!-- Host OS optional -->
  <rect x="90" y="320" width="640" height="52" rx="10" fill="#A5B4FC"/>
  <text x="410" y="345" text-anchor="middle" font-size="15" font-weight="700" fill="#312E81">Host OS (optional)</text>
  <text x="410" y="363" text-anchor="middle" font-size="11.5" fill="#3730A3">Provides drivers &amp; system services for the hypervisor</text>

  <!-- Hardware -->
  <rect x="90" y="386" width="640" height="70" rx="10" fill="#312E81"/>
  <text x="410" y="416" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Physical Hardware</text>
  <text x="410" y="438" text-anchor="middle" font-size="12" fill="#C7D2FE">CPU  ·  RAM  ·  Storage  ·  Network</text>

  <text x="410" y="490" text-anchor="middle" font-size="13" font-style="italic" fill="#B91C1C">Each VM carries its own full Guest OS → that is why VMs are heavy.</text>
</svg>
