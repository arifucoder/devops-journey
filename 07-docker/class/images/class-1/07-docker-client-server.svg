<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="860" height="520" fill="#F5F6FF"/>
  <text x="430" y="42" text-anchor="middle" font-size="28" font-weight="700" fill="#312E81">Docker Client–Server Architecture</text>
  <text x="430" y="68" text-anchor="middle" font-size="15" fill="#64748B">How the Docker components work together</text>

  <!-- CLIENT -->
  <rect x="24" y="92" width="180" height="330" rx="14" fill="#FFFFFF" stroke="#818CF8" stroke-width="2"/>
  <text x="114" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#312E81">Docker Client</text>
  <text x="114" y="140" text-anchor="middle" font-size="12" fill="#64748B">(docker CLI)</text>
  <g font-family="DejaVu Sans Mono, monospace" font-size="12">
    <rect x="40" y="156" width="148" height="34" rx="6" fill="#EEF2FF"/><text x="52" y="178" fill="#4338CA">docker run</text>
    <rect x="40" y="196" width="148" height="34" rx="6" fill="#EEF2FF"/><text x="52" y="218" fill="#4338CA">docker build</text>
    <rect x="40" y="236" width="148" height="34" rx="6" fill="#EEF2FF"/><text x="52" y="258" fill="#4338CA">docker pull</text>
    <rect x="40" y="276" width="148" height="34" rx="6" fill="#EEF2FF"/><text x="52" y="298" fill="#4338CA">docker ps</text>
    <rect x="40" y="316" width="148" height="34" rx="6" fill="#EEF2FF"/><text x="52" y="338" fill="#4338CA">docker logs</text>
  </g>
  <text x="114" y="374" text-anchor="middle" font-size="11.5" fill="#64748B">The CLI we type</text>
  <text x="114" y="392" text-anchor="middle" font-size="11.5" fill="#64748B">commands into.</text>

  <!-- socket arrow -->
  <path d="M206 250 L252 250" stroke="#334155" stroke-width="3" marker-end="url(#a1)"/>
  <path d="M252 268 L206 268" stroke="#334155" stroke-width="3" marker-end="url(#a1b)"/>
  <text x="229" y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">REST API</text>
  <text x="229" y="300" text-anchor="middle" font-size="10" fill="#64748B">docker.sock</text>

  <!-- ENGINE -->
  <rect x="256" y="92" width="360" height="330" rx="14" fill="#FFFFFF" stroke="#2496ED" stroke-width="2.5"/>
  <text x="436" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#0B5FA5">Docker Engine (Host)</text>

  <!-- daemon -->
  <rect x="278" y="132" width="316" height="60" rx="10" fill="#2496ED"/>
  <text x="436" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Docker Daemon (dockerd)</text>
  <text x="436" y="178" text-anchor="middle" font-size="11" fill="#DBEAFE">Manages images, containers, networks, volumes</text>

  <!-- containerd -->
  <rect x="278" y="202" width="316" height="52" rx="10" fill="#C7D2FE"/>
  <text x="436" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#312E81">containerd (core runtime)</text>
  <text x="436" y="244" text-anchor="middle" font-size="10.5" fill="#4338CA">namespaces · cgroups · create / start / stop</text>

  <!-- objects -->
  <rect x="278" y="266" width="98" height="72" rx="9" fill="#ECFDF5" stroke="#34D399"/>
  <text x="327" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">Containers</text>
  <text x="327" y="316" text-anchor="middle" font-size="10" fill="#059669">running</text>
  <text x="327" y="329" text-anchor="middle" font-size="10" fill="#059669">instances</text>

  <rect x="387" y="266" width="98" height="72" rx="9" fill="#EEF2FF" stroke="#818CF8"/>
  <text x="436" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#3730A3">Images</text>
  <text x="436" y="316" text-anchor="middle" font-size="10" fill="#4338CA">read-only</text>
  <text x="436" y="329" text-anchor="middle" font-size="10" fill="#4338CA">blueprints</text>

  <rect x="496" y="266" width="98" height="72" rx="9" fill="#FEF3C7" stroke="#FBBF24"/>
  <text x="545" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">Volumes</text>
  <text x="545" y="316" text-anchor="middle" font-size="10" fill="#B45309">persistent</text>
  <text x="545" y="329" text-anchor="middle" font-size="10" fill="#B45309">data</text>

  <!-- host storage -->
  <rect x="278" y="350" width="316" height="52" rx="10" fill="#1E293B"/>
  <text x="436" y="374" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Host Storage</text>
  <text x="436" y="392" text-anchor="middle" font-size="10.5" fill="#94A3B8" font-family="DejaVu Sans Mono, monospace">/var/lib/docker/</text>

  <!-- push pull arrows -->
  <path d="M620 200 L666 200" stroke="#059669" stroke-width="3" marker-end="url(#a2)"/>
  <text x="643" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">PUSH</text>
  <path d="M666 240 L620 240" stroke="#4F46E5" stroke-width="3" marker-end="url(#a3)"/>
  <text x="643" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#4F46E5">PULL</text>

  <!-- REGISTRY -->
  <rect x="670" y="92" width="166" height="330" rx="14" fill="#FFFFFF" stroke="#818CF8" stroke-width="2"/>
  <text x="753" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#312E81">Docker Registry</text>
  <text x="753" y="140" text-anchor="middle" font-size="11.5" fill="#64748B">Image repository</text>

  <rect x="688" y="160" width="130" height="70" rx="10" fill="#EEF2FF"/>
  <text x="753" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#2496ED">Docker Hub</text>
  <text x="753" y="212" text-anchor="middle" font-size="11" fill="#64748B">public registry</text>

  <rect x="688" y="244" width="130" height="70" rx="10" fill="#FFF7ED"/>
  <text x="753" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#EA580C">Amazon ECR</text>
  <text x="753" y="296" text-anchor="middle" font-size="11" fill="#64748B">AWS private</text>

  <text x="753" y="352" text-anchor="middle" font-size="11.5" fill="#64748B">Store &amp; share</text>
  <text x="753" y="370" text-anchor="middle" font-size="11.5" fill="#64748B">your images.</text>

  <!-- footer -->
  <rect x="24" y="440" width="812" height="56" rx="12" fill="#EEF2FF"/>
  <text x="430" y="465" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4338CA">Flow:  Client (CLI)  →  docker.sock  →  Daemon (dockerd)  →  containerd  →  runs containers</text>
  <text x="430" y="484" text-anchor="middle" font-size="12" fill="#64748B">Images come from a registry via pull / push.</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="a1b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#059669"/></marker>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4F46E5"/></marker>
  </defs>
</svg>
