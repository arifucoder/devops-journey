<svg viewBox="0 0 820 470" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="820" height="470" fill="#F5F6FF"/>
  <text x="410" y="44" text-anchor="middle" font-size="29" font-weight="700" fill="#312E81">Dockerfile → Image → Container</text>
  <text x="410" y="70" text-anchor="middle" font-size="15" fill="#64748B">The core Docker flow, with a house-building analogy</text>

  <!-- Card 1: Dockerfile -->
  <rect x="40" y="100" width="220" height="200" rx="14" fill="#FFFFFF" stroke="#818CF8" stroke-width="2"/>
  <circle cx="72" cy="132" r="16" fill="#4F46E5"/>
  <text x="72" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
  <text x="98" y="138" font-size="17" font-weight="700" fill="#312E81">Dockerfile</text>
  <text x="60" y="162" font-size="12" fill="#64748B">Set of instructions</text>
  <!-- mini code -->
  <rect x="60" y="174" width="180" height="110" rx="8" fill="#1E1B4B"/>
  <text x="72" y="196" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#A5B4FC">FROM nginx:alpine</text>
  <text x="72" y="216" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#93C5FD">COPY index.html ...</text>
  <text x="72" y="236" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#FCD34D">EXPOSE 80</text>
  <text x="72" y="256" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#6EE7B7">CMD ["nginx"...]</text>
  <text x="72" y="276" font-family="DejaVu Sans Mono, monospace" font-size="10" fill="#64748B"># the recipe</text>

  <!-- arrow 1 -->
  <text x="288" y="196" text-anchor="middle" font-size="13" fill="#4338CA" font-weight="700">build</text>
  <path d="M272 205 L306 205" stroke="#4F46E5" stroke-width="3" marker-end="url(#ah)"/>

  <!-- Card 2: Image -->
  <rect x="315" y="100" width="220" height="200" rx="14" fill="#FFFFFF" stroke="#818CF8" stroke-width="2"/>
  <circle cx="347" cy="132" r="16" fill="#4F46E5"/>
  <text x="347" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
  <text x="373" y="138" font-size="17" font-weight="700" fill="#312E81">Docker Image</text>
  <text x="335" y="162" font-size="12" fill="#64748B">The blueprint (read-only)</text>
  <!-- stacked layers icon -->
  <g>
    <polygon points="425,190 495,175 425,160 355,175" fill="#818CF8"/>
    <polygon points="425,214 495,199 425,184 355,199" fill="#6366F1"/>
    <polygon points="425,238 495,223 425,208 355,223" fill="#4F46E5"/>
    <text x="425" y="272" text-anchor="middle" font-size="12" fill="#64748B">stacked layers</text>
  </g>

  <!-- arrow 2 -->
  <text x="563" y="196" text-anchor="middle" font-size="13" fill="#047857" font-weight="700">run</text>
  <path d="M547 205 L581 205" stroke="#059669" stroke-width="3" marker-end="url(#ah2)"/>

  <!-- Card 3: Container -->
  <rect x="590" y="100" width="200" height="200" rx="14" fill="#FFFFFF" stroke="#34D399" stroke-width="2"/>
  <circle cx="622" cy="132" r="16" fill="#059669"/>
  <text x="622" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
  <text x="648" y="138" font-size="16" font-weight="700" fill="#065F46">Container</text>
  <text x="610" y="162" font-size="12" fill="#64748B">Running instance</text>
  <!-- running box -->
  <rect x="628" y="180" width="124" height="90" rx="10" fill="#065F46"/>
  <circle cx="646" cy="200" r="5" fill="#34D399"/>
  <text x="690" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">APP</text>
  <text x="690" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#6EE7B7">RUNNING</text>

  <!-- analogy strip -->
  <rect x="40" y="330" width="750" height="100" rx="12" fill="#EEF2FF"/>
  <text x="415" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#4338CA">Real-world house analogy</text>
  <text x="160" y="392" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312E81">Notebook</text>
  <text x="160" y="412" text-anchor="middle" font-size="12" fill="#64748B">(your requirements)</text>
  <text x="290" y="402" text-anchor="middle" font-size="20" fill="#4F46E5">→</text>
  <text x="415" y="392" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312E81">Blueprint</text>
  <text x="415" y="412" text-anchor="middle" font-size="12" fill="#64748B">(engineer's plan)</text>
  <text x="540" y="402" text-anchor="middle" font-size="20" fill="#059669">→</text>
  <text x="670" y="392" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065F46">Built House</text>
  <text x="670" y="412" text-anchor="middle" font-size="12" fill="#64748B">(you live in it)</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4F46E5"/></marker>
    <marker id="ah2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#059669"/></marker>
  </defs>
</svg>
